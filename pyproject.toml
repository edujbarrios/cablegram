[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cablegram"
version = "0.2.0"
description = "Token-efficient communication for humans and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Eduardo J. Barrios" },
]
keywords = [
  "ai-agents",
  "communication",
  "tokenization",
  "token-efficiency",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "tiktoken>=0.12,<1",
]

[project.scripts]
cablegram = "cablegram.cli:main"

[project.urls]
Homepage = "https://github.com/edujbarrios/cablegram"
Issues = "https://github.com/edujbarrios/cablegram/issues"
Repository = "https://github.com/edujbarrios/cablegram"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
